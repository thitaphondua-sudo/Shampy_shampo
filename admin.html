<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายการคำสั่งซื้อ | Shampy_shampoo</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <style>
    /* เฉพาะหน้าแอดมิน */
    .admin-section {
      padding-top: var(--space-5);
    }

    .page-title {
      margin-bottom: var(--space-3);
      font-size: var(--text-2xl);
      line-height: 1.5;
    }

    .page-lead {
      margin-bottom: var(--space-5);
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--color-white);
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
    }

    #ordersTable {
      width: 100%;
      min-width: 48rem;
      border-collapse: collapse;
      font-size: var(--text-sm);
    }

    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2);
      text-align: left;
      vertical-align: top;
      line-height: 1.7;
      border-bottom: 1px solid var(--color-line);
    }

    #ordersTable th {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 500;
      white-space: nowrap;
      color: var(--color-ink);
      border-bottom-color: var(--color-line-strong);
    }

    #ordersTable td {
      color: var(--color-ink-soft);
    }

    #ordersTable td:first-child {
      white-space: nowrap;
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Shampy_shampoo</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section admin-section">
      <div class="container">
        <div class="text-center">
          <h1 class="page-title title-mark text-center">รายการคำสั่งซื้อ</h1>
          <p class="lead page-lead">รายการล่าสุดอยู่ด้านบน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>Shampy_shampoo</span>
      <span>© 2026 Shampy_shampoo สงวนลิขสิทธิ์</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
